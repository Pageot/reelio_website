{{- $title := cond .IsHome site.Title (printf "%s · %s" .Title site.Title) -}}
{{- $desc := .Description | default site.Params.description -}}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}" />
<link rel="canonical" href="{{ .Permalink }}" />
<meta name="theme-color" content="#FFD344" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}" />
<meta property="og:site_name" content="Reelio" />
<meta property="og:title" content="{{ $title }}" />
<meta property="og:description" content="{{ $desc }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="https://reelio.ch/assets/Reelio_SocialsShare.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The Reelio app showing a video library of hover-scrub thumbnails, on a yellow background." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ $title }}" />
<meta name="twitter:description" content="{{ $desc }}" />
<meta name="twitter:image" content="https://reelio.ch/assets/Reelio_SocialsShare.jpg" />
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
{{- $css := resources.Get "css/docs.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
