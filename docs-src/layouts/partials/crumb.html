{{- $group := partial "group-of.html" .File.ContentBaseName -}}
<nav class="crumb" aria-label="Breadcrumb">
  <a href="{{ site.Home.RelPermalink }}">Docs</a>

  <span class="sep" aria-hidden="true">/</span><span aria-current="page">{{ .Params.navTitle | default .Title }}</span>
</nav>
